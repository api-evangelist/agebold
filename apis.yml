aid: agebold
name: Agebold
description: Agebold, which operates as Bold, is a digital healthy-aging platform for adults
  65 and older, delivered as a covered benefit through Medicare Advantage plans and other
  Medicare organizations. Bold offers personalized, science-backed exercise programs shown to
  reduce fall risk, ease musculoskeletal pain, and increase physical activity, alongside
  nutrition and weight-loss support (including GLP-1 care), live classes, expert talks, and
  virtual access to doctors, therapists, and nurse practitioners in select states. The company
  partners with health plans to improve quality measures, Star Ratings, HOS performance, and
  total cost of care. Agebold is a Khosla Ventures portfolio company; as of this profile it
  publishes no public API, developer portal, SDKs, or OpenAPI surface.
